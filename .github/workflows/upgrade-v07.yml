name: Publicar Guerra Sem Fim v0.7
on:
  push:
    branches: [main]
    paths:
      - 'v07-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Conferir alterações e executar testes
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f v07-patch/part01.b64 ]; then
            echo 'Versão já publicada.'
            exit 0
          fi
          cat v07-patch/part{01..08}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v07.patch
          echo '1f719008d574c8f01f51c3e73c77782077502cb1f9ba27c0809d30abebcbbb78  /tmp/gsf-v07.patch' | sha256sum -c
          git apply --check /tmp/gsf-v07.patch
          git apply /tmp/gsf-v07.patch
          for script in js/*.js; do node --check "$script"; done
          for testfile in tests/*.js; do node "$testfile"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v07-patch
          git rm .github/workflows/upgrade-v07.yml
          git add -A
          git commit -m 'feat: Guerra Sem Fim v0.7 - expansao e filas configuraveis'
          git push origin HEAD:main
