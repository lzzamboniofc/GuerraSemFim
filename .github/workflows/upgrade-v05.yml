name: Publicar Guerra Sem Fim v0.5
on:
  push:
    branches: [main]
    paths:
      - 'v05-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar-atualizacao:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v4
      - name: Aplicar patch e verificar versão
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v05-patch/part01.b64 ]]; then
            echo 'A versão 0.5 já está aplicada.'
            exit 0
          fi
          cat v05-patch/part{01..09}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v05.patch
          echo 'f68888bbac4e428205376be87950dbd2f02ded34ee908f289c654818254ad9a1  /tmp/gsf-v05.patch' | sha256sum -c
          git apply --check /tmp/gsf-v05.patch
          git apply /tmp/gsf-v05.patch
          for f in js/*.js tests/*.js; do node --check "$f"; done
          for t in tests/*.test.js; do node "$t"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v05-patch
          git rm .github/workflows/upgrade-v05.yml
          git add -A
          git commit -m 'feat: Guerra Sem Fim v0.5 - Impérios e Diplomacia'
          git push origin HEAD:main
