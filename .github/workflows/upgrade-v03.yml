name: Aplicar Guerra Sem Fim v0.3
on:
  push:
    branches: [main]
    paths:
      - 'v03-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verificar e aplicar mudanças
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v03-patch/part01.b64 ]]; then
            echo "A atualização já foi aplicada."
            exit 0
          fi
          cat v03-patch/part{01..06}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v03.patch
          echo '438eb1f8ab8d802a325c099495a20c256150e11ea90f96e2deb6bd56779e1a97  /tmp/gsf-v03.patch' | sha256sum -c
          git apply --check /tmp/gsf-v03.patch
          git apply /tmp/gsf-v03.patch
          node --check js/ai.js
          node --check js/engine.js
          node --check js/app.js
          node tests/smoke.test.js
          node tests/regression.test.js
          node tests/world.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v03-patch
          git rm .github/workflows/upgrade-v03.yml
          git add -A
          git commit -m 'feat: Guerra Sem Fim v0.3 - Mundo Vivo e reinos NPC'
          git push origin HEAD:main
