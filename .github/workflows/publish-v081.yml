name: Publicar design v0.8.1
on:
  push:
    branches: [main]
    paths:
      - 'v081-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar atualização e verificar
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v081-patch/part01.b64 ]]; then
            echo "A versão v0.8.1 já foi aplicada."
            exit 0
          fi
          cat v081-patch/part{01..07}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v081.patch
          echo '27d6b373e32f5f407ea3af95b9c460934045746c315d005b387b2c4aa0767799  /tmp/gsf-v081.patch' | sha256sum --check
          git apply --check /tmp/gsf-v081.patch
          git apply /tmp/gsf-v081.patch
          test -s assets/village-backdrop-v081.webp
          test -s assets/map-backdrop-v081.webp
          node --check js/app.js
          for t in tests/*.test.js; do node "$t"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v081-patch
          git rm .github/workflows/publish-v081.yml
          git add -A
          git commit -m 'feat: v0.8.1 redesenhar mapa e aldeia'
          git push origin HEAD:main
