name: Aplicar atualização v1.2
on:
  push:
    branches: [main]
    paths:
      - '.release/v12-payload.b64'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão anterior
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar pacote e aplicar atualização
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release/v12-payload.b64 > /tmp/gsf-v12.tar.xz
          echo '98571912a735effafef50c3b154270feb1c028286f021c18becc3db7cfee892e  /tmp/gsf-v12.tar.xz' | sha256sum -c -
          tar -xJf /tmp/gsf-v12.tar.xz
          node --check js/engine.js
          node --check js/app.js
          for test in tests/*.test.js; do echo "Testando $test"; node "$test"; done
      - name: Publicar versão final sem arquivos temporários
        shell: bash
        run: |
          set -euo pipefail
          rm -f .release/v12-payload.b64 .github/workflows/gsf-v12-upgrade.yml
          rmdir .release 2>/dev/null || true
          git config user.name 'GuerraSemFim CI'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: v1.2 equipamento do heroi, aventuras e fauna nos oasis'
          git push origin HEAD:main
