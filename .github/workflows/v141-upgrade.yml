name: Publicar v1.4.1 — demolição e mercado
on:
  push:
    branches: [main]
    paths:
      - '.github/v141/part01.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar atualizacao e executar todas as suites
        shell: bash
        run: |
          set -euo pipefail
          cat .github/v141/part{01..03}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v141-ops.json
          node .github/v141-upgrade.cjs
          node --check js/app.js
          node --check js/engine.js
          for test in tests/*.test.js; do
            echo "TEST $test"
            node "$test"
          done
      - name: Confirmar e publicar codigo final
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/v141 .github/v141-upgrade.cjs .github/workflows/v141-upgrade.yml
          git add -A
          git commit -m "feat: v1.4.1 demolição, cereal detalhado e troca 1:1 sem taxa"
          git push origin HEAD:main
