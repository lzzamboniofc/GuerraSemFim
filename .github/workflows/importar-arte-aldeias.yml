name: Importar ilustrações de aldeias por estágio
on:
  push:
    branches: [feat/aldeias-ilustradas-v18]
    paths: [.github/workflows/importar-arte-aldeias.yml]
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aldeias-ilustradas-v18
          persist-credentials: true
      - name: Copiar as ilustrações do projeto de referência e otimizar para WebP
        run: |
          set -euo pipefail
          mkdir -p assets/village-stages
          if command -v magick >/dev/null 2>&1; then
            export CONVERTER=magick
          elif command -v convert >/dev/null 2>&1; then
            export CONVERTER=convert
          else
            export CONVERTER=python
            python3 -c 'from PIL import Image' || (python3 -m pip install --user --break-system-packages Pillow)
          fi
          echo "Conversor: $CONVERTER"
          for stage in outpost hamlet small medium town large; do
            src="https://raw.githubusercontent.com/LucasRZamboni/ReinosDeGuerra/main/assets/village-${stage}.png"
            curl -fLSs --retry 4 --retry-all-errors --connect-timeout 15 --max-time 120 "$src" -o "/tmp/village-${stage}.png"
            if [ "$CONVERTER" = python ]; then
              python3 -c 'from PIL import Image; import sys; im=Image.open(sys.argv[1]).convert("RGB"); im.thumbnail((960,960),Image.Resampling.LANCZOS); im.save(sys.argv[2], "WEBP",quality=74, method=6)' "/tmp/village-${stage}.png" "assets/village-stages/${stage}.webp"
            else
              "$CONVERTER" "/tmp/village-${stage}.png" -resize 960x960\\> -quality 74 "assets/village-stages/${stage}.webp"
            fi
            test -s "assets/village-stages/${stage}.webp"
            ls -lh "assets/village-stages/${stage}.webp"
          done
      - name: Incorporar ilustrações otimizadas na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/village-stages/*.webp
          git commit -m "assets: adicionar seis ilustrações de estágio em WebP otimizado"
          git push origin HEAD:feat/aldeias-ilustradas-v18
