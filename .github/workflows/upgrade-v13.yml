name: Aplicar v1.3 — IA, Hospital e Diplomacia
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/upgrade-v13.yml
      - release/v13-upgrade.patch.b64
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar alterações verificadas
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode release/v13-upgrade.patch.b64 | xz --decompress > /tmp/v13.patch
          echo '5ecc3ecfbf988df8c0d089cae3fb2723bc7d0ef524b2dc4e0d7491ab0361743a  /tmp/v13.patch' | sha256sum --check
          git apply --check /tmp/v13.patch
          git apply /tmp/v13.patch
          node --check js/app.js
          node --check js/engine.js
          node --check js/ai.js
          for test in tests/*.test.js; do
            echo "Executando $test"
            node "$test"
          done
      - name: Publicar código e remover temporários
        shell: bash
        run: |
          set -euo pipefail
          git rm --force .github/workflows/upgrade-v13.yml release/v13-upgrade.patch.b64
          git add -A
          git config user.name "Guerra Sem Fim CI"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: v1.3 IA tatica, hospital, defesa e rompimento de aliancas"
          git push origin HEAD:main
