name: Publicar Guerra Sem Fim v0.4
on:
  push:
    branches: [main]
    paths:
      - 'v04-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do projeto
        uses: actions/checkout@v4
      - name: Aplicar e validar a Era das Guerras
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v04-patch/part01.b64 ]]; then
            echo 'A versão 0.4 já foi aplicada.'
            exit 0
          fi
          cat v04-patch/part{01..06}.b64 | base64 --decode | xz --decompress > /tmp/gsf-v04.patch
          echo 'e3c9a5dd0811c333707ffc376e5884c50f0e8b24e2c24ea1017a5c120699b249  /tmp/gsf-v04.patch' | sha256sum -c
          git apply --check /tmp/gsf-v04.patch
          git apply /tmp/gsf-v04.patch
          for f in js/*.js tests/*.js; do node --check "$f"; done
          node tests/smoke.test.js
          node tests/regression.test.js
          node tests/world.test.js
          node tests/war.test.js
          node tests/ui.test.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v04-patch
          git rm .github/workflows/upgrade-v04.yml
          git add -A
          git commit -m 'feat: Guerra Sem Fim v0.4 - Era das Guerras'
          git push origin HEAD:main
