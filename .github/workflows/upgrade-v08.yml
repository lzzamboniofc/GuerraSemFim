name: Aplicar Guerra Sem Fim v0.8
on:
  push:
    branches: [main]
    paths:
      - 'v08-patch/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validar e aplicar atualizacao v0.8
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f v08-patch/part01.b64 ]]; then
            echo 'Atualizacao ja aplicada.'
            exit 0
          fi
          cat v08-patch/part*.b64 | base64 --decode | xz --decompress > /tmp/guerrasemfim-v08.patch
          echo 'd6809898454d0a7d095d0f831bf04ad80d4d497591e17ca1f7d64c199f94e91e  /tmp/guerrasemfim-v08.patch' | sha256sum -c
          git apply --check /tmp/guerrasemfim-v08.patch
          git apply /tmp/guerrasemfim-v08.patch
          for source in js/*.js; do node --check "$source"; done
          for testfile in tests/*.test.js; do echo "Running $testfile"; node "$testfile"; done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r v08-patch
          git rm .github/workflows/upgrade-v08.yml
          git add -A
          git commit -m 'feat: v0.8 territorio, oases, hero multi-recursos e novo visual'
          git push origin HEAD:main
