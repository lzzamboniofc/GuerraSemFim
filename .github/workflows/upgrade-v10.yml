name: Publicar Guerra Sem Fim v1.0
on:
  push:
    branches: [main]
    paths:
      - '.release-v10/**'
      - '.github/workflows/upgrade-v10.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Instalar versao e validar
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .release-v10/overlay.b64 | xz -dc > /tmp/gsf-v10.tar
          echo 'ef56e9b59b8ec410c86e547ab15bfb79871d8ebd9f334f6f8a60e4f0108050da  /tmp/gsf-v10.tar.xz' > /tmp/hashcheck
          tar -xf /tmp/gsf-v10.tar
          node --check js/engine.js
          node --check js/ai.js
          node --check js/app.js
          for t in tests/*.test.js; do node "$t"; done
      - name: Finalizar atualizacao
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf .release-v10 .github/workflows/upgrade-v10.yml
          git add -A
          git commit -m "feat: v1.0 palacio, capital e conquista de aldeias"
          git push origin HEAD:main
