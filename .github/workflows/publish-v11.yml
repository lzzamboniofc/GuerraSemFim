name: Publicar versão 1.1
on:
  push:
    branches: [main]
    paths:
      - '.github/v11-upgrade.b64'
      - '.github/workflows/publish-v11.yml'
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar atualização e testar
        run: |
          set -euo pipefail
          base64 -d .github/v11-upgrade.b64 | xz -d > /tmp/guerra-sem-fim-v11.patch
          echo "30c7db97447a6e1c728423ad4b7be1510cd7ea345df9ffac851d0b0eed568d10  /tmp/guerra-sem-fim-v11.patch" | sha256sum -c -
          git apply --check /tmp/guerra-sem-fim-v11.patch
          git apply /tmp/guerra-sem-fim-v11.patch
          node --check js/engine.js
          node --check js/app.js
          for test in tests/*.test.js; do node "$test"; done
      - name: Publicar arquivos definitivos
        run: |
          set -euo pipefail
          git config user.name "Guerra Sem Fim CI"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/publish-v11.yml .github/v11-upgrade.b64
          git add -A
          git commit -m "feat: v1.1 economia, mercadores e formularios persistentes"
          git push origin HEAD:main
